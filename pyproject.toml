[project]
name = "fayda-mcp"
version = "0.1.0"
description = "Fayda eSignet identity verification tools for Model Context Protocol (MCP)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "pyjwt>=2.9.0",
    "fastmcp>=4.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
redis = [
    "redis>=5.0.0",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "greenlet>=3.0.0",
]
all = [
    "fayda-mcp[fastapi,redis,postgres]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "fayda-mcp[all]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".env*",
    "*.pem",
    "*.key",
    "*.crt",
    "*.pfx",
    "*.p12",
    "secrets.json",
    "secrets.yaml",
    "secrets.yml",
    "*.secret",
    ".git*",
    ".pytest_cache*",
    "uv.lock",
    "*venv*",
    "scratch*",
    "dist*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fayda_mcp"]
exclude = [
    ".env*",
    "*.pem",
    "*.key",
    "*.crt",
    "*.pfx",
    "*.p12",
    "secrets.json",
    "secrets.yaml",
    "secrets.yml",
    "*.secret",
]

[tool.pyright]
extraPaths = ["src"]
include = ["src", "examples", "tests"]
venvPath = "."
venv = ".venv"
