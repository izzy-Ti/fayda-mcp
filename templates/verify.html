<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification | Fayda</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h1 { font-size: 1.5rem; margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; line-height: 1.5; }
        .btn { display: inline-block; width: 100%; text-align: center; background: #0284c7; color: white; padding: 12px; border-radius: 8px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: background 0.2s; box-sizing: border-box; }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Fayda Identity Verification</h1>
        <p>A business application is requesting verification of your identity using Ethiopia's National ID (Fayda eSignet).</p>
        <form method="POST" action="">
            <input type="hidden" name="csrf_token" value="{{ csrf_token | default('') }}">
            <button type="submit" class="btn">Proceed to Fayda eSignet</button>
        </form>
    </div>
</body>
</html>
